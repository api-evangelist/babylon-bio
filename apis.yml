name: Babylon Bio
description: 'Babylon Bio (Babylon Biosciences) is a San Francisco-based drug discovery and development
  company founded in 2023 and backed by Lux Capital. Staffed by experienced medicinal chemists and
  biologists with a track record of discovering FDA-approved medicines, the company develops
  therapeutics that rescue essential functions in the brain rather than clearing emergent pathology,
  leveraging a proprietary high-throughput assay platform with an early focus on neurodegenerative
  disease including Alzheimer''s. It was surfaced as a portfolio company of Lux Capital and added to
  the API Evangelist network. As a private, pre-commercial biotech it publishes no public API,
  developer portal, or documentation surface at this time.'
